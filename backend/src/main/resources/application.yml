spring:
  application:
    name: bro-calendar
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bro_calendar}
    username: ${DATABASE_USERNAME:bro_calendar}
    password: ${DATABASE_PASSWORD:bro_calendar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never
